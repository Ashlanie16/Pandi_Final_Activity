<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>
      Input username
	  <input id="user" type="text" />
	  Input password
	  <input id="pass" type="text" />
	  Confirm Password
	  <input id="confirm" type="text" />
        
        
		<button
		  type="button"
		  onclick="
		    clickButton(
			  document.getElementByID('user').value,
			  document.getElementByID('pass').value,
			  document.getElementByID('confirm').value,
			  (document.location.href = 'login.html'),
			)
		"
		>
	      Sign in
	    </button>
		<button type="button" onclick="document.location.href = 'register.html'">
		  Register
		</button>

		<script>
          const user = "qwer";
		  const pass = "1234"

		const clickButton = (a, b) => {

			const postData = {
				username:a,
				password:b,
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'pandi_main.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}
        
		</script>
	</body>
</html>
