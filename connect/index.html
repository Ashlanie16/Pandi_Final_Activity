<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	

		Your name:
		<input id='name' type='text'>
		Your age:
		<input id='age' type='text'>
        Your gender:
		<input id='gender' type='text'>
		Your favorite program:
		<input id='program' type='text'>
        Your most favorite course:
		<input id='favorite course' type='text'>
		Your coding level:
		<input id='coding level' type='text'>
		Your current year level:
        <input id='year level' type='text'>
		Your least favorite course:
		<input id='least favorite course' type='text'>
        Your current academic year:
		<input id='academic year' type='text'>
		Your TOTGA program:
		<input id='totga program' type='text'>
        Your dream career:
		<input id='career' type='text'>

		<button type="button" onclick="clickButton( document.getElementById('name').value ,document.getElementById('age').value, document.getElementById('gender').value,
		document.getElementById('program').value, document.getElementById('favorite course').value, document.getElementById('coding level').value,
		document.getElementById('year level').value, document.getElementById('least favorite course').value, document.getElementById('academic year').value,
		document.getElementById('totga program').value, document.getElementById('career').value )">Click Me!</button>
        
		<script>


		
		const clickButton = (a,b,c,d,e,f,g,h,i,j) =>{

			const postData = {
				name:a,
				age:b,
				gender:c,
                favorite_program:d,
				coding_level:e,
				current_year_level:f,
				least_favorite_course:g,
                current_academic_year:h,
				TOTGA_program:i,
				dream_career:j
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
